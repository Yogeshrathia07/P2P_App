
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Doubt Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>P2P Doubt Board</h2>
    <span id="status">Not Connected</span>
</header>

<main>
    <section class="intro">
        <h1>Share Doubts.<br><span>Learn Together.</span></h1>
        <p>Ask questions and share answers directly with another student.</p>
    </section>

    <section class="connection">
        <h2>Connect Students</h2>

        <input id="name" placeholder="Enter your name">

        <button id="create">Create Connection</button>

        <textarea id="remote" placeholder="Paste partner's connection code"></textarea>

        <button id="accept">Accept Connection</button>

        <textarea id="local" placeholder="Your connection code" readonly></textarea>

        <button id="copy">Copy Code</button>
    </section>

    <section class="board">
        <h2>Discussion Board</h2>

        <input id="doubt" placeholder="Write your doubt or answer">

        <button id="post">Post Message</button>

        <div id="posts"></div>

        <button id="clear">Clear My Local Board</button>
    </section>

</main>

<footer>
    P2P Doubt Board | HTML | CSS | JavaScript | WebRTC
</footer>

<script src="app.js"></script>

</body>
</html>
